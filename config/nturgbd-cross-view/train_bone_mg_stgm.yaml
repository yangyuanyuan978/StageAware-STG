work_dir: ./work_dir/ntu/xview/mg_stgm_agcn_bone
model_saved_name: ./runs/ntu_cv_mg_stgm_agcn_bone

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: ./data/ntu/xview/train_data_bone.npy
  label_path: ./data/ntu/xview/train_label.pkl
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  normalization: False

test_feeder_args:
  data_path: ./data/ntu/xview/val_data_bone.npy
  label_path: ./data/ntu/xview/val_label.pkl  

# model - MG-STGM-AGCN (多粒度选择性时序门控图卷积网络)
model: model.mg_stgm_agcn.Model
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'
  use_mg: True              # 使用多粒度GCN (创新点1)
  use_stgm: True           # 使用轻量级Mamba (创新点2)
  stgm_layers: [9,10]  # 在L8,L9,L10使用Mamba
  mg_mode: learned
  mg_fusion: dynamic_subset
  gate_reduction: 8
  gate_dropout: 0.1
  pa_lambda: 0.2
  align_norm: True
  use_checkpoint: Ture     # 小数据集不需要

# optim
weight_decay: 0.0001
base_lr: 0.1
step: [30, 40]              # 与Baseline一致
warm_up_epoch: 5

# training
device: [0, 1, 2]
batch_size: 64              # 与Baseline一致
test_batch_size: 64
num_epoch: 50               # 与Baseline一致
nesterov: True