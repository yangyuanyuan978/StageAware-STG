work_dir: ./work_dir/kinetics/mg_stgm_agcn_joint
model_saved_name: ./runs/ki_mg_stgm_agcn_joint

# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  random_choose: True
  random_move: True
  window_size: 150
  data_path: ./data/kinetics_raw/kinetics-skeleton/train_data.npy
  label_path: ./data/kinetics_raw/kinetics-skeleton/train_label.pkl
  debug: False

test_feeder_args:
  data_path: ./data/kinetics_raw/kinetics-skeleton/val_data.npy
  label_path: ./data/kinetics_raw/kinetics-skeleton/val_label.pkl

# model
  model: model.mg_stgm_agcn.Model
model_args:
  num_class: 400
  num_person: 2
  num_point: 18
  graph: graph.kinetics.Graph
  graph_args:
    labeling_mode: 'spatial'
  use_mg: True
  use_stgm: True          # 使用选择性时序门控模块 (创新点2)
  stgm_layers: [9, 10]  # 保持不变
  mg_mode: learned
  mg_fusion: dynamic_subset
  gate_reduction: 8
  gate_dropout: 0.1
  pa_lambda: 0.2
  align_norm: True
  use_checkpoint: True

#optim
weight_decay: 0.0001
base_lr: 0.1
step: [45, 55]

# training
device: [0, 1, 2]
batch_size: 128
test_batch_size: 256
num_epoch: 65
nesterov: True